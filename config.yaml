# YouTube Analysis Configuration
# Edit these settings to customize your analysis

# Search Settings
search:
  keyword: "Data Engineering Jobs"
  max_results: 50

# Filter Settings
filters:
  min_views: 100
  max_views: 1000000
  min_subscribers: 100
  max_subscribers: 100000
  min_views_per_hour: 0.05
  min_comments_per_hour: 0.001
  min_likes_per_hour: 0.001
  max_hours_since_published: 17520
  require_email_found: true
  require_transcript: true

# Output Settings
output:
  directory: "results"
  save_csv: true
  save_excel: false
  save_json: false

# Analysis Settings
analysis:
  include_channel_stats: true
  include_video_stats: true
  include_engagement_metrics: true
  include_sentiment_analysis: false 